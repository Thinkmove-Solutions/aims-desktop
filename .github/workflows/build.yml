name: Build & Release

on:
  push:
    branches: [main]
    tags:     ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            artifact: squirrel.windows/x64
            ext: exe
          - os: macos-latest
            platform: darwin
            arch: x64
            artifact: zip/darwin/x64
            ext: zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build icons
        run: node scripts/create-icons.js

      - name: Make (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-forge make --platform=win32 --arch=x64

      - name: Make (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-forge make --platform=darwin --arch=x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aims-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/make/${{ matrix.artifact }}/**
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
